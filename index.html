const mv={x:0,y:0};let jid=null,lid=null,jx=0,jy=0,lx=0,ly=0;const jb=$("jb"),jk=$("jk");

function tmove(t){if(t.identifier==jid){let dx=(t.clientX-jx)/45,dy=(t.clientY-jy)/45;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}mv.x=Math.abs(dx)<.2?0:dx;mv.y=Math.abs(dy)<.2?0:-dy;jk.style.transform=`translate(${dx*30}px,${dy*30}px)`}else if(t.identifier==lid){yaw-=(t.clientX-lx)*.006;pitch=cl(pitch-(t.clientY-ly)*.006,-1.3,1.3);lx=t.clientX;ly=t.clientY}}
document.addEventListener("touchstart",e=>{if(st!="play"||e.target.closest("#card,.tb"))return;e.preventDefault();for(const t of e.changedTouches){if(t.clientX<innerWidth*.45&&jid==null){jid=t.identifier;jx=t.clientX;jy=t.clientY;jb.style.display="block";jb.style.left=jx-50+"px";jb.style.top=jy-50+"px"}else if(lid==null){lid=t.identifier;lx=t.clientX;ly=t.clientY}}},{passive:false});
document.addEventListener("touchmove",e=>{if(st!="play")return;e.preventDefault();for(const t of e.changedTouches)tmove(t)},{passive:false});
const tend=e=>{for(const t of e.changedTouches){if(t.identifier==jid){jid=null;mv.x=mv.y=0;jb.style.display="none";jk.style.transform=""}if(t.identifier==lid)lid=null}};
document.addEventListener("touchend",tend);document.addEventListener("touchcancel",tend);
const tbt=(id,dn,up)=>{const b=$(id);b.addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();dn()},{passive:false});b.addEventListener("touchend",e=>{e.preventDefault();if(up)up()},{passive:false})};

function updM(m,dt,mov,spr){const p=m.g.position,d=Math.hypot(P.x-p.x,P.z-p.z);if(m.wait>0){m.wait-=dt;p.y=-5;return 99}p.y=0;
const det=spr?16:mov?(fl?11:6):(fl?7:3.5);if(d<det){if(m.ch<=0)sfx.growl();m.ch=6}m.ch-=dt;const c=PH[ph],sp=m.ch>0?c.sp:c.sp*.5,mc=ci(p),pc=ci(P);let tx,tz;
if(m.ch>0&&mc==pc){tx=P.x;tz=P.z}else{if(mc!=m.lc){m.lc=mc;m.rt=0}if(m.pt==null||mc==m.pt)m.pt=rnd(W*W);m.rt-=dt;if(m.rt<=0){m.nx=nextStep(mc,m.ch>0?pc:m.pt);m.rt=.3}tx=((m.nx%W)+.5)*CS;tz=(Math.floor(m.nx/W)+.5)*CS}
const a=Math.atan2(tx-p.x,tz-p.z),dd=Math.hypot(tx-p.x,tz-p.z),s=Math.min(sp*dt,dd);p.x+=Math.sin(a)*s;p.z+=Math.cos(a)*s;
m.g.rotation.y=m.ch>0?Math.atan2(P.x-p.x,P.z-p.z):a;m.g.arms.forEach((o,k)=>o.rotation.x=m.ch>0?-1.3+Math.sin(time*9+k*3)*.3:-.15+Math.sin(time*3+k*3)*.15);m.g.jaw.rotation.x=m.ch>0?.8+Math.sin(time*16)*.2:.25;m.g.head.rotation.z=Math.sin(time*(m.ch>0?12:2))*(m.ch>0?.25:.1);p.y=Math.abs(Math.sin(time*(m.ch>0?9:3)))*.08;return d}
function upd(dt){time+=dt;const c=PH[ph];
if(keys.ArrowLeft)yaw+=1.8*dt;if(keys.ArrowRight)yaw-=1.8*dt;
let fw=cl((keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+mv.y,-1,1),rt=cl((keys.KeyD?1:0)-(keys.KeyA?1:0)+mv.x,-1,1);const mov=Math.abs(fw)>.15||Math.abs(rt)>.15;
const spr=mov&&keys.ShiftLeft&&sta>5;sta=cl(sta+(spr?-26:14)*dt,0,100);const sp=spr?5.6:3.2;
if(mov){const l=Math.hypot(fw,rt),dx=(-Math.sin(yaw)*fw+Math.cos(yaw)*rt)/l*sp*dt,dz=(-Math.cos(yaw)*fw-Math.sin(yaw)*rt)/l*sp*dt;if(!blocked(P.x+dx,P.z))P.x+=dx;if(!blocked(P.x,P.z+dz))P.z+=dz;bob+=dt*sp*2.3;stepT-=dt;if(stepT<=0){sfx.step();stepT=spr?.3:.5}}
shake=Math.max(0,shake-dt*.8);cam.position.set(P.x+(Math.random()-.5)*shake*.2,1.6+Math.sin(bob)*.05*(mov?1:0)+(Math.random()-.5)*shake*.2,P.z);cam.rotation.set(pitch,yaw,0);
if(fl)bat-=dt*(1.1+ph*.2);if(bat<=0){bat=0;if(fl){fl=false;msg("La torcia si è spenta.",3000)}}
let minD=99;mons.forEach(m=>{const d=updM(m,dt,mov,spr);minD=Math.min(minD,d);if(d<1.15&&m.wait<=0&&st=="play")die(m)});
flOff-=dt;spot.visible=fl&&flOff<=0;let inten=2.6;if((minD<9&&Math.random()<.12)||(bat<15&&Math.random()<.2))inten=.15;spot.intensity=inten;
items.forEach((m,k)=>{m.rotation.y+=dt*1.6;m.position.y=1.1+Math.sin(time*2+k)*.1});bats.forEach(m=>m.rotation.y+=dt*2);
for(let k=items.length-1;k>=0;k--){const m=items[k];if(Math.hypot(m.position.x-P.x,m.position.z-P.z)<1.3){lvl.remove(m);items.splice(k,1);got++;sfx.pick();sfx.whisper();shake=.3;msg(c.notes[(got-1)%c.notes.length],5000);
if(got>=c.need){doorOpen=true;ex.m.color.set(0x22ff55);exL.color.set(0x22ff55);setTimeout(()=>{msg("Il portone si è aperto. E loro lo hanno sentito. CORRI.",5000);sfx.bang();mons.forEach(m=>{m.ch=10;m.wait=0})},2500)}}}
for(let k=bats.length-1;k>=0;k--){const m=bats[k];if(Math.hypot(m.position.x-P.x,m.position.z-P.z)<1.3){lvl.remove(m);bats.splice(k,1);bat=Math.min(100,bat+45);sfx.pick();msg("Batteria trovata.",2000)}}
exCd-=dt;if(Math.hypot(P.x-ex.x,P.z-ex.z)<2.4){if(doorOpen)endPhase();else if(exCd<=0){exCd=4;msg(`Il portone è sigillato. Mancano ${c.need-got} ${c.it}.`,3000)}}
hb-=dt;if(hb<=0&&minD<22){sfx.beat(.25+.55*(1-minD/22));hb=.35+minD/22*1.1}
const dg=cl(1-minD/14,0,1);$("flash").style.opacity=dg*.25*(.6+.4*Math.sin(time*10));if(dg>.5)shake=Math.max(shake,dg*.25);
nextScare-=dt;if(nextScare<=0){nextScare=18+Math.random()*25;const r=rnd(4);
if(r==0){flOff=1.6;sfx.bang();msg("La luce è morta.",1800)}else if(r==1){sfx.whisper();msg(["«Sono dietro di te.»","«Non sei solo.»","«Spegni la luce.»","«Ti vedo.»"][rnd(4)],3000)}else if(r==2){sfx.bang();shake=.5}else{for(let k=0;k<6;k++)setTimeout(()=>sfx.step(),k*230);msg("Passi alle tue spalle…",2500)}}
$("cnt").textContent=`${c.it} ${got}/${c.need}`;$("bb").style.width=bat+"%";$("sb").style.width=sta+"%";$("vig").style.opacity=.75+dg*.25}
function dying(dt){dieT+=dt;time+=dt;const g=dm.g,k=cl((dieT-.35)/.18,0,1),f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),d=2.4-k*1.35,s=1+k*.15,fe=$("flash");
if(!dm.s&&dieT>.35){dm.s=1;if(master)master.gain.value=1.4;sfx.scream()}
g.position.set(P.x+f.x*d,-.9*k,P.z+f.z*d);g.scale.setScalar(s);g.arms.forEach((o,i)=>o.rotation.x=-.3-k*1.1+Math.sin(time*30+i)*.1*k);g.jaw.rotation.x=.2+k*1.0+(k?Math.sin(time*45)*.2:0);g.head.rotation.z=k?Math.sin(time*60)*.18:0;
pitch=cl(Math.atan2(2.2*s-.9*k-1.6,Math.max(d-.5*s,.3)),-.3,1.2);cam.fov=72+k*34;cam.updateProjectionMatrix();

if(k>0){fe.style.background=Math.sin(time*70)>0?"#fff":"#b01414";fe.style.opacity=Math.random()*.7}else fe.style.opacity=0;
if(dieT>2.8){st="card";$("flash").style.opacity=0;$("flash").style.background="";card("SEI MORTO",["Ti ha trovato.","Il buio ti ha inghiottito.","Hai sentito il suo respiro, ma era già tardi.","Nessuno verrà a cercarti."][rnd(4)],"RIPROVA LA FASE",()=>begin(ph))}}
(function frame(){requestAnimationFrame(frame);const dt=Math.min(clk.getDelta(),.05);if(st=="play")upd(dt);else if(st=="dying")dying(dt);ren.render(scene,cam)})();
